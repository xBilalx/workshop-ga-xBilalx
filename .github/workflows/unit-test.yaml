name: Tests

on:
  push:
    branches:
      - main
      - dev

jobs:
  unit-test:
    runs-on: ubuntu-20.04
    container: docker://epitechcontent/epitest-docker

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v3


      - name: Run tests
        shell: bash
        run: make tests_run >> output_test_coverage 2>&1
      
      - name: Run converage
        shell: bash
        run: make coverage >> output_test_coverage 2>&1

      - name: Archive coverage in Artefact
        uses: actions/upload-artifact@v4
        with:
          name: coverage_outputs
          path: output_test_coverage